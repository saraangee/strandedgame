function normalizeAvatarFile(file,onDone){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const src=document.createElement("canvas");
        src.width=img.naturalWidth||img.width;
        src.height=img.naturalHeight||img.height;
        const sx=src.getContext("2d",{willReadFrequently:true});
        sx.clearRect(0,0,src.width,src.height);
        sx.drawImage(img,0,0);
        const data=sx.getImageData(0,0,src.width,src.height).data;
        let minX=src.width,minY=src.height,maxX=-1,maxY=-1;
        for(let y=0;y<src.height;y++){
          for(let x=0;x<src.width;x++){
            if(data[(y*src.width+x)*4+3]>8){
              if(x<minX)minX=x;if(x>maxX)maxX=x;
              if(y<minY)minY=y;if(y>maxY)maxY=y;
            }
          }
        }
        if(maxX<minX||maxY<minY){onDone(ev.target.result);return;}
        const cropW=maxX-minX+1,cropH=maxY-minY+1;
        const target=document.createElement("canvas");
        target.width=440; target.height=620;
        const tx=target.getContext("2d");
        tx.clearRect(0,0,target.width,target.height);
        const padX=28,padTop=24,padBottom=18;
        const availW=target.width-padX*2;
        const availH=target.height-padTop-padBottom;
        const scale=Math.min(availW/cropW,availH/cropH);
        const dw=cropW*scale,dh=cropH*scale;
        const dx=(target.width-dw)/2;
        const dy=target.height-padBottom-dh;
        tx.drawImage(src,minX,minY,cropW,cropH,dx,dy,dw,dh);
        onDone(target.toDataURL("image/png"));
      }catch(err){
        onDone(ev.target.result);
      }
    };
    img.onerror=()=>onDone(ev.target.result);
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

  const [divPoints,setDivPoints] =useState(()=>sanitizePoints(load("sg_divpoints")));
  const [divWeekly,setDivWeekly] =useState(()=>sanitizePoints(null));
  const [history,setHistory]     =useState(()=>load("sg_history2")||[]);
  const [rules,setRules]         =useState(()=>{const saved=load("sg_rules2");return Array.isArray(saved)&&saved.length?saved:DEFAULT_RULES;});
  const [newName,setNewName]     =useState("");
  const [newDiv,setNewDiv]       =useState("div1");
  const [notifs,setNotifs]       =useState([]);
  const [tab,setTab]             =useState("staff");
  const [overlay,setOverlay]     =useState(null);
  const [custId,setCustId]       =useState(null);
  const [sideOpen,setSideOpen]   =useState(true);
  const [collapsed,setCollapsed] =useState({});
  const [standingEvents,setStandingEvents]=useState({planes:[]});
  const [standingsResults,setStandingsResults]=useState([]);
  const [celebrating,setCelebr]  =useState([]);
  const [mapCharSize,setMapCharSize]=useState(()=>{const v=load("sg_mapsize");return typeof v==="number"?v:26;});

  useEffect(()=>save("sg_staff2",staff),[staff]);
  useEffect(()=>save("sg_divpoints",divPoints),[divPoints]);
  useEffect(()=>save("sg_history2",history),[history]);
  useEffect(()=>save("sg_rules2",rules),[rules]);
  useEffect(()=>save("sg_mapsize",mapCharSize),[mapCharSize]);

  // Pull the shared state from Supabase once on load (overrides local cache if present)
  useEffect(()=>{
    if(!sb) return;
    let cancelled=false;
    sbLoad().then(remote=>{
      if(cancelled) return;
      if(remote){
        if(Array.isArray(remote.staff)) setStaff(sanitizeStaff(remote.staff));
        if(remote.divPoints) setDivPoints(sanitizePoints(remote.divPoints));
        if(Array.isArray(remote.history)) setHistory(remote.history);
        if(Array.isArray(remote.rules)&&remote.rules.length) setRules(remote.rules);
        if(typeof remote.mapCharSize==="number") setMapCharSize(remote.mapCharSize);
      }
      setRemoteReady(true);
    });
    return ()=>{cancelled=true;};
  },[]);

  // Push the whole state to Supabase whenever it changes (debounced), once initial load is done
  useEffect(()=>{
    if(!sb || !remoteReady) return;
    const t=setTimeout(()=>{
      sbSave({staff,divPoints,history,rules,mapCharSize});
    },600);
    return ()=>clearTimeout(t);
  },[staff,divPoints,history,rules,mapCharSize,remoteReady]);

  function updateRule(i,k,v){setRules(rs=>rs.map((r,idx)=>idx===i?{...r,[k]:v}:r));}
  function addRule(){setRules(rs=>[...rs,{title:"New rule",body:""}]);}
  function removeRule(i){setRules(rs=>rs.filter((_,idx)=>idx!==i));}

  function addStaff(){
    const name=newName.trim();if(!name)return;
    setStaff(p=>[...p,{id:Date.now()+Math.random(),name,divisionId:newDiv,fullyHatted:false,photoUrl:null,fullAvatarUrl:null,hairColor:"#3a2a1a",hairStyle:"short",skinColor:"#f5cba7"}]);
    setNewName("");
  }
  function updateP(id,k,v){setStaff(ps=>ps.map(p=>p.id===id?{...p,[k]:v}:p));}
  function removeP(id){setStaff(ps=>ps.filter(p=>p.id!==id));}
  function setDivPointsDirect(id,v){setDivPoints(pv=>({...pv,[id]:(v===""||isNaN(v))?0:Number(v)}));}
  function setDivWeeklyVal(id,v){setDivWeekly(pv=>({...pv,[id]:v}));}

  // Build divisions with members + cumulative points + resolved zone
  const divisions = DIVISIONS.map(d=>({...d, members:staff.filter(p=>p.divisionId===d.id)}));
  const divZone = {};
  divisions.forEach(d=>{
    const everyoneHatted = d.members.length>0 && d.members.every(p=>p.fullyHatted);
    divZone[d.id] = everyoneHatted ? "plane" : getZoneForPoints(divPoints[d.id]||0);
  });

  function runStandings(){
    showSplash();
    const toasts=[]; const planes=[]; const results=[];
    const newPoints={...divPoints};
    DIVISIONS.forEach(d=>{ if(newPoints[d.id]==null) newPoints[d.id]=0; });

    divisions.forEach(d=>{
      const members=d.members;
      const add=Number(divWeekly[d.id])||0;
      newPoints[d.id]=(newPoints[d.id]||0)+add;
      if(add!==0){
        toasts.push({id:Math.random(),bg:"#1565C0",icon:"⭐",title:"Points Added!",body:d.name+" — +"+add+" pts this round"});
      }
      const everyoneHatted=members.length>0 && members.every(p=>p.fullyHatted);
      if(everyoneHatted){
        planes.push({name:d.name});
        toasts.push({id:Math.random(),bg:"#880e4f",icon:"✈️",title:"Plane to Italy!",body:d.name+" — everyone fully hatted!"});
      }
      results.push({id:d.id,name:d.name,color:d.color,members,weeklyEarned:add,cumulative:newPoints[d.id]||0,zone:everyoneHatted?"plane":getZoneForPoints(newPoints[d.id]||0)});
    });
    results.sort((a,b)=>b.cumulative-a.cumulative);
    const maxWeekly=Math.max(0,...results.map(r=>r.weeklyEarned));
    results.forEach((r,i)=>{ r.rank=i+1; r.isTopEarner=maxWeekly>0 && r.weeklyEarned===maxWeekly; });
    results.reverse();

    const updatedStaff=staff;

    const snapshotDivisions=DIVISIONS.map(d=>({id:d.id,name:d.name,points:newPoints[d.id]||0,zone:getZoneForPoints(newPoints[d.id]||0),members:staff.filter(p=>p.divisionId===d.id).map(p=>p.name)}));

    setHistory(h=>[...h,{date:new Date().toLocaleDateString(),divisions:snapshotDivisions,events:{planes}}]);
    setDivPoints(newPoints);
    setDivWeekly(sanitizePoints(null));
    setStaff(updatedStaff);
    setStandingEvents({planes});
    setStandingsResults(results);
    setOverlay(null);
    const celebIds=staff.filter(p=>{const d=divisions.find(x=>x.id===p.divisionId);return d && (getZoneForPoints(newPoints[d.id]||0)==="treehouse");}).map(p=>p.id);
    setCelebr(celebIds);
    setTimeout(()=>setOverlay("announce"),1400);
    toasts.forEach((n,i)=>setTimeout(()=>setNotifs(pv=>[...pv,n]),i*450+300));
    setTimeout(()=>setCelebr([]),6000);
  }

  const btnStyle=(active,color="#8B6914")=>({
    background:active?"rgba(139,105,20,.3)":"transparent",
    border:"1px solid "+(active?color:"rgba(139,105,20,.22)"),
    color:active?"#C9A84C":"rgba(255,255,255,.35)",
    padding:"8px 11px",borderRadius:4,cursor:"pointer",
    fontFamily:"Cinzel,cursive",fontSize:8,letterSpacing:2,whiteSpace:"nowrap",
  });

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#04090f",color:"white",fontFamily:"Oswald,sans-serif",overflow:"hidden"}}>
      {overlay==="announce"&&<Announcement results={standingsResults} events={standingEvents} onClose={()=>setOverlay(null)}/>}
      {overlay==="rules"&&<RulesPage rules={rules} onUpdate={updateRule} onAdd={addRule} onRemove={removeRule} onClose={()=>setOverlay(null)}/>}

      {/* HEADER */}
      <div style={{background:"linear-gradient(180deg,#030c14,#071625)",borderBottom:"3px solid #8B6914",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,zIndex:100,gap:10,flexWrap:"wrap"}}>
        <div style={{flexShrink:0}}>
          <div style={{fontFamily:"Cinzel Decorative,cursive",fontSize:22,fontWeight:700,color:"white",textShadow:"2px 2px 0 #3a1800,0 0 28px rgba(255,107,0,.8)",letterSpacing:4,lineHeight:1}}>
            STR<span style={{color:"#FF6B00"}}>A</span>NDED
          </div>
          <div style={{fontFamily:"Cinzel,cursive",fontSize:9,color:"#C9A84C",letterSpacing:2,marginTop:1}}>GET HATTED TO SURVIVE</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",maxWidth:520}}>
            {ZONES.slice(0,7).map(z=>(
              <div key={z.id} style={{background:"rgba(0,0,0,.3)",border:"1px solid "+z.accent+"33",borderRadius:4,padding:"2px 6px",textAlign:"center"}}>
                <div style={{fontSize:11}}>{z.emoji}</div>
                <div style={{fontFamily:"Cinzel,cursive",fontSize:6,color:z.accent,lineHeight:1}}>{z.pts}</div>
              </div>
            ))}
          </div>
          <div style={{width:1,height:34,background:"rgba(139,105,20,.35)",flexShrink:0}}/>
          <button onClick={runStandings} style={{background:"linear-gradient(135deg,#FF6B00,#FF9500)",border:"none",cursor:"pointer",padding:"9px 16px",borderRadius:4,fontFamily:"Cinzel,cursive",fontSize:9,fontWeight:700,color:"white",letterSpacing:2,boxShadow:"0 0 16px rgba(255,107,0,.5)",whiteSpace:"nowrap",flexShrink:0}}>
            ▶ RUN STANDINGS
          </button>
          <div style={{width:1,height:34,background:"rgba(139,105,20,.35)",flexShrink:0}}/>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,flexShrink:0}}>
            <span style={{fontFamily:"Cinzel,cursive",fontSize:6,color:"rgba(255,255,255,.4)",letterSpacing:1}}>MAP SIZE</span>
            <input type="range" min="14" max="120" value={mapCharSize} onChange={e=>setMapCharSize(Number(e.target.value))} style={{width:70}}/>
          </div>
          <div style={{width:1,height:34,background:"rgba(139,105,20,.35)",flexShrink:0}}/>
          <button onClick={()=>setOverlay("announce")} style={btnStyle(overlay==="announce")}>📺 STANDINGS</button>
          <button onClick={()=>setOverlay("rules")}    style={btnStyle(overlay==="rules","#6464cc")}>📜 RULES</button>
          {["staff","history"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={btnStyle(tab===t)}>
              {t==="staff"?"👥":"📜"} {t.charAt(0).toUpperCase()+t.slice(1)}
            </button>
          ))}
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden",position:"relative"}}>
        {/* MAP */}
        <div style={{flex:1,position:"relative",overflow:"hidden"}}>
          <img src={MAP} alt="Island" style={{width:"100%",height:"100%",objectFit:"fill",background:"#0a1828",display:"block"}}/>
          <div style={{position:"absolute",fontSize:70,pointerEvents:"none",zIndex:20,left:"6%",top:"32%",animation:"sharkLeapA 4.5s ease-in-out infinite"}}>🦈</div>
          <div style={{position:"absolute",fontSize:60,pointerEvents:"none",zIndex:18,left:"20%",top:"90%",animation:"crabScuttle 10s linear infinite"}}>🦀</div>

          {ZONE_LABELS.map(l=>{const z=ZM[l.id];return(
            <div key={l.id} style={{position:"absolute",left:l.x+"%",top:l.y+"%",transform:"translate(-50%,-50%)",zIndex:15,pointerEvents:"none",background:"rgba(0,0,0,.48)",border:"1px solid "+z.accent,borderRadius:999,padding:"3px 8px",boxShadow:"0 2px 6px rgba(0,0,0,.45)",fontFamily:"Cinzel,cursive",fontSize:10,fontWeight:800,letterSpacing:.35,color:z.accent,textShadow:"0 2px 3px #000",whiteSpace:"nowrap"}}>{z.emoji} {l.name}</div>
          );})}

          {ZONES.map(z=>{
            const divsHere = divisions.filter(d=>divZone[d.id]===z.id && d.members.length>0);
            const anchors = ZONE_ANCHORS[z.id]||[{x:50,y:50}];
            const scale = mapCharSize/26;
            return divsHere.map((d,di)=>{
              const anchor = anchors[di%anchors.length];
              return(
                <div key={d.id} style={{position:"absolute",left:anchor.x+"%",top:anchor.y+"%",transform:"translate(-50%,-50%)",zIndex:z.id==="plane"?45:30,transition:"left 1.5s ease, top 1.5s ease, padding .3s ease",filter:"drop-shadow(0 6px 12px rgba(0,0,0,.9))"}}>
                  <div style={{background:"rgba(0,0,0,.55)",border:Math.max(1,Math.round(2*scale))+"px solid "+d.color,borderRadius:Math.round(8*scale),padding:Math.round(3*scale)+"px "+Math.round(6*scale)+"px "+Math.round(5*scale)+"px",display:"flex",flexDirection:"column",alignItems:"center",gap:Math.max(1,Math.round(1*scale)),animation:z.id==="plane"?"planeTakeoffMap 1.8s ease-in forwards":"none"}}>
                    <div style={{fontFamily:"Cinzel,cursive",fontSize:Math.max(6,Math.round(7*scale)),fontWeight:700,color:d.color,letterSpacing:.5,whiteSpace:"nowrap"}}>{d.short} · {divPoints[d.id]||0}pt</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:Math.max(1,Math.round(1*scale)),maxWidth:Math.round(80*scale),justifyContent:"center"}}>
                      {d.members.map(p=>(
                        <div key={p.id} style={{display:"flex",flexDirection:"column",alignItems:"center",animation:celebrating.includes(p.id)?"jumpHappy .55s ease-in-out infinite":"none"}}>
                          <Chibi person={p} zoneId={z.id} celebrating={celebrating.includes(p.id)} size={mapCharSize}/>
                          <div style={{fontSize:Math.min(11,Math.max(6,Math.round(6*scale))),lineHeight:1.1,color:"rgba(255,255,255,.88)",fontFamily:"Oswald,sans-serif",fontWeight:500,marginTop:-2,whiteSpace:"nowrap",maxWidth:mapCharSize*2.2,overflow:"hidden",textOverflow:"ellipsis",textShadow:"0 1px 2px #000,0 0 4px #000"}}>{p.name}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            });
          })}

          <div style={{position:"absolute",bottom:14,right:14,display:"flex",flexDirection:"column",gap:7,zIndex:50,pointerEvents:"none"}}>
            {notifs.slice(-5).map(n=>(
              <div key={n.id} style={{display:"flex",alignItems:"center",gap:9,background:n.bg,border:"2px solid rgba(255,255,255,.28)",borderRadius:9,padding:"9px 13px",boxShadow:"0 6px 24px rgba(0,0,0,.85)",animation:"slideIn .4s ease",maxWidth:280}}>
                <span style={{fontSize:22}}>{n.icon}</span>
                <div>
                  <div style={{fontFamily:"Cinzel,cursive",fontSize:10,fontWeight:700,color:"white",letterSpacing:1}}>{n.title}</div>
                  <div style={{fontSize:9,color:"rgba(255,255,255,.75)",marginTop:2}}>{n.body}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* SIDEBAR TOGGLE */}
        <div style={{position:"absolute",right:sideOpen?320:0,top:"50%",transform:"translateY(-50%)",zIndex:60,transition:"right .3s ease"}}>
          <button onClick={()=>setSideOpen(o=>!o)} style={{background:"#0a1828",border:"2px solid #8B6914",borderRight:"none",color:"#C9A84C",padding:"12px 5px",cursor:"pointer",borderRadius:"6px 0 0 6px",fontSize:13,display:"flex",flexDirection:"column",alignItems:"center",gap:3,boxShadow:"-3px 0 10px rgba(0,0,0,.4)"}}>
            <span>{sideOpen?"▶":"◀"}</span>
            <span style={{fontSize:7,letterSpacing:1,fontFamily:"Cinzel,cursive",writingMode:"vertical-rl"}}>{sideOpen?"HIDE":"SHOW"}</span>
          </button>
        </div>

        {/* SIDEBAR */}
        <div style={{width:sideOpen?320:0,background:"#070e1a",borderLeft:sideOpen?"2px solid rgba(139,105,20,.25)":"none",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden",transition:"width .3s ease"}}>

          {tab==="staff"&&<>
            <div style={{padding:"10px 13px",borderBottom:"1px solid rgba(139,105,20,.15)",flexShrink:0}}>
              <div style={{fontFamily:"Cinzel,cursive",fontSize:8,letterSpacing:4,color:"#C9A84C",opacity:.6,marginBottom:6}}>ADD SURVIVOR</div>
              <div style={{display:"flex",gap:5,marginBottom:5}}>
                <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addStaff()} placeholder="Full name..." style={{flex:1,background:"rgba(255,255,255,.06)",border:"1px solid rgba(139,105,20,.25)",borderRadius:4,padding:"7px 9px",color:"white",fontSize:12,outline:"none"}}/>
                <button onClick={addStaff} style={{background:"#8B6914",border:"none",borderRadius:4,padding:"7px 13px",cursor:"pointer",color:"white",fontSize:15,fontWeight:700}}>+</button>
              </div>
              <select value={newDiv} onChange={e=>setNewDiv(e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(139,105,20,.25)",borderRadius:4,padding:"6px 8px",color:"white",fontSize:11,outline:"none"}}>
                {DIVISIONS.map(d=>(<option key={d.id} value={d.id} style={{background:"#0a1428"}}>{d.name}</option>))}
              </select>
              <div style={{fontSize:7,color:"rgba(255,202,40,.45)",marginTop:5,lineHeight:1.4}}>Divisions move together — everyone in a division stands in the same zone, based on the division's cumulative points.</div>
            </div>

            <div style={{flex:1,overflowY:"auto",padding:"4px 0"}}>
              {staff.length===0&&<div style={{textAlign:"center",padding:"28px 14px",color:"rgba(255,255,255,.13)",fontSize:11,fontStyle:"italic"}}>Add staff to place them on the island</div>}
              {DIVISIONS.map(d=>{
                const members=staff.filter(p=>p.divisionId===d.id);
                const pts=divPoints[d.id]||0;
                const zid=divZone[d.id];
                const z=ZM[zid];
                const isCollapsed=collapsed[d.id];
                return(
                  <div key={d.id} style={{borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                    <div style={{padding:"8px 13px",background:"rgba(255,255,255,.02)"}}>
                      <div onClick={()=>setCollapsed(c=>({...c,[d.id]:!c[d.id]}))} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:6}}>
                        <div style={{width:12,height:12,borderRadius:3,background:d.color,flexShrink:0,border:"1px solid rgba(255,255,255,.3)"}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:11,fontWeight:700,color:d.color}}>{d.name} <span style={{fontSize:8,color:"rgba(255,255,255,.4)"}}>({members.length})</span></div>
                          <div style={{fontSize:8,color:z?z.accent:"#888"}}>{z?z.emoji+" "+z.name:""}</div>
                        </div>
                        <span style={{fontSize:10,color:"rgba(255,255,255,.3)"}}>{isCollapsed?"▸":"▾"}</span>
                      </div>
                      <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                        <div style={{display:"flex",flexDirection:"column",gap:1}}>
                          <span style={{fontSize:6,color:"rgba(255,255,255,.35)",letterSpacing:1}}>CUMULATIVE (edit to correct)</span>
                          <input type="number" value={divPoints[d.id]||0} onChange={e=>setDivPointsDirect(d.id,e.target.value)} style={{width:70,background:"rgba(255,255,255,.08)",border:"2px solid "+(z?z.accent:"#8B6914")+"66",borderRadius:3,padding:"3px 6px",color:z?z.accent:"white",fontSize:12,fontWeight:700,textAlign:"center",outline:"none"}}/>
                        </div>
                        <div style={{display:"flex",flexDirection:"column",gap:1}}>
                          <span style={{fontSize:6,color:"rgba(255,255,255,.35)",letterSpacing:1}}>DIV PTS THIS WEEK</span>
                          <input type="number" placeholder="0" value={divWeekly[d.id]||""} onChange={e=>setDivWeeklyVal(d.id,e.target.value)} style={{width:70,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.15)",borderRadius:3,padding:"3px 6px",color:"white",fontSize:12,textAlign:"center",outline:"none"}}/>
                        </div>
                      </div>
                    </div>
                    {!isCollapsed&&members.map(p=>{
                      const ic=custId===p.id;
                      return(
                        <div key={p.id} className="srow" style={{padding:"7px 13px 7px 24px",borderBottom:"1px solid rgba(255,255,255,.03)"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <div style={{flexShrink:0}}><Chibi person={p} zoneId={zid} celebrating={false} size={40}/></div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:11,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}{p.fullyHatted&&<span style={{marginLeft:3,fontSize:9}}>👑</span>}</div>
                            </div>
                            <button onClick={()=>setCustId(ic?null:p.id)} style={{background:ic?"rgba(139,105,20,.35)":"none",border:ic?"1px solid #8B6914":"none",borderRadius:3,color:ic?"#C9A84C":"rgba(255,255,255,.3)",cursor:"pointer",fontSize:12,padding:"3px 6px",lineHeight:1}}>🎨</button>
                            <button title={"Remove "+p.name} onClick={()=>{if(window.confirm("Remove "+p.name+" from the game?")){removeP(p.id);if(custId===p.id)setCustId(null);}}} style={{background:"rgba(120,20,20,.18)",border:"1px solid rgba(255,90,90,.28)",borderRadius:4,color:"rgba(255,130,130,.78)",cursor:"pointer",fontFamily:"Cinzel,cursive",fontSize:7,fontWeight:700,letterSpacing:.5,padding:"5px 7px",lineHeight:1}}>REMOVE</button>
                          </div>
                          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                            <label style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:p.fullyHatted?"#ce93d8":"rgba(255,255,255,.3)",background:"rgba(255,255,255,.04)",border:"1px solid "+(p.fullyHatted?"rgba(206,147,216,.5)":"rgba(255,255,255,.08)"),borderRadius:3,padding:"3px 6px",cursor:"pointer"}}><input type="checkbox" checked={p.fullyHatted} onChange={e=>updateP(p.id,"fullyHatted",e.target.checked)} style={{width:9,height:9}}/> 👑 Fully hatted</label>
                          </div>
                          {ic&&<Customizer person={p} onChange={(k,v)=>updateP(p.id,k,v)} onClose={()=>setCustId(null)}/>}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </>}

          {tab==="history"&&<div style={{flex:1,overflowY:"auto",padding:13}}>
            <div style={{fontFamily:"Cinzel,cursive",fontSize:8,letterSpacing:4,color:"#C9A84C",opacity:.6,marginBottom:10}}>STANDINGS HISTORY</div>
            {history.length===0&&<div style={{fontSize:9,color:"rgba(255,255,255,.2)",fontStyle:"italic"}}>Run standings to start tracking</div>}
            {[...history].reverse().map((e,hi)=>(
              <div key={hi} style={{marginBottom:10,background:"rgba(255,255,255,.03)",borderRadius:5,padding:"9px 10px",border:"1px solid rgba(139,105,20,.12)"}}>
                <div style={{fontFamily:"Cinzel,cursive",fontSize:9,color:"#C9A84C",marginBottom:6}}>{e.date||"No date"}</div>
                {e.events&&<div style={{fontSize:8,color:"rgba(255,255,255,.55)",marginBottom:6,lineHeight:1.5}}>
                  {(e.events.courses||[]).length>0&&<div>🍣 Courses: {e.events.courses.map(ev=>ev.name+" ("+ev.div+")").join(", ")}</div>}
                  {(e.events.bonuses||[]).length>0&&<div>🎉 Bonuses: {e.events.bonuses.map(ev=>ev.div+" +"+ev.pts).join(", ")}</div>}
                  {(e.events.planes||[]).length>0&&<div>✈️ Plane to Italy: {e.events.planes.map(ev=>ev.name).join(", ")}</div>}
                </div>}
                {(e.divisions||[]).map(d=>(
                  <div key={d.id} style={{marginBottom:3,display:"flex",alignItems:"flex-start",gap:4}}>
                    <span style={{fontSize:8,color:DM[d.id]?DM[d.id].color:"#fff",width:60,flexShrink:0,fontFamily:"Cinzel,cursive"}}>{d.name}</span>
                    <span style={{fontSize:8,color:"rgba(255,255,255,.5)"}}>{d.points} pts — {ZM[d.zone]?ZM[d.zone].name:d.zone}</span>
                  </div>
                ))}
              </div>
            ))}
            <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid rgba(255,60,60,.12)"}}>
              <div style={{fontSize:8,color:"rgba(255,80,80,.4)",letterSpacing:2,marginBottom:6}}>⚠ DANGER ZONE</div>
              <button onClick={()=>{if(!window.confirm("Reset ALL data?"))return;localStorage.clear();setStaff([]);setHistory([]);setDivPoints(sanitizePoints(null));setRules(DEFAULT_RULES);}} style={{background:"rgba(255,50,50,.08)",border:"1px solid rgba(255,50,50,.28)",color:"rgba(255,120,120,.65)",borderRadius:4,padding:"7px 12px",cursor:"pointer",fontFamily:"Cinzel,cursive",fontSize:8,letterSpacing:2,width:"100%"}}>
                🗑 RESET ALL DATA
              </button>
            </div>
          </div>}

        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  render(){
    if(this.state.err){
      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,background:"#04090f",color:"white",fontFamily:"Oswald,sans-serif",padding:24,textAlign:"center"}}>
          <div style={{fontFamily:"Cinzel,cursive",fontSize:22,color:"#C9A84C",letterSpacing:4}}>STRANDED</div>
          <div style={{fontSize:14,opacity:.8,maxWidth:420}}>Something went wrong loading the island — usually caused by old or corrupted saved data.</div>
          <div style={{fontSize:11,opacity:.5,maxWidth:480,wordBreak:"break-word"}}>{String(this.state.err&&this.state.err.message||this.state.err)}</div>
          <button onClick={()=>{try{localStorage.removeItem("sg_staff2");localStorage.removeItem("sg_history2");localStorage.removeItem("sg_divpoints");}catch(e){}location.reload();}} style={{background:"linear-gradient(135deg,#FF6B00,#FF9500)",border:"none",cursor:"pointer",padding:"11px 22px",borderRadius:6,fontFamily:"Cinzel,cursive",fontSize:11,fontWeight:700,color:"white",letterSpacing:2}}>RESET SAVED DATA &amp; RELOAD</button>
          <div style={{fontSize:9,opacity:.4}}>This clears survivors and standings history.</div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

      +'<div style="font-size:22px;letter-spacing:4px;color:#C9A84C">STRANDED</div>'

      +(ok?'A script error occurred — check the browser console (right-click &rarr; Inspect &rarr; Console) for the red error message.'
          :'The React/Babel libraries did not load. This needs an internet connection the first time you open it (they come from a CDN). Reconnect and reopen.')
